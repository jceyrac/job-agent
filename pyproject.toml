[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.17.3,<0.18"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
py-modules = ["tracker"]
packages = [
    "core",
    "core.scrapers",
    "core.scrapers.ats",
    "core.scrapers.boards",
    "core.scrapers.company_sites",
    "core.cv_agent",
    "tracker_views",
    "scripts",
    "api",
    "api.routers",
]

[tool.setuptools.package-data]
scripts = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Always-bug rules only (spec 044b FR-005): syntax/IO errors (E9), invalid
# comparisons (F63), statement errors (F7), undefined names (F82). No style
# rules, no unused-import rules, no formatter (Constitution V).
select = ["E9", "F63", "F7", "F82"]
