[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
py-modules = ["tracker"]
packages = [
    "core",
    "core.scrapers",
    "core.scrapers.ats",
    "core.scrapers.boards",
    "core.scrapers.company_sites",
    "core.cv_agent",
    "tracker_views",
    "scripts",
]

[tool.setuptools.package-data]
scripts = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
