services:

  tracker:
    build: .
    container_name: job-tracker
    command: streamlit run tracker.py --server.port 8501 --server.address 0.0.0.0 --server.fileWatcherType none
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - job_data:/app/data
    env_file:
      - .env
    environment:
      - JOB_AGENT_DATA_DIR=/app/data
      - JOB_AGENT_REQUIRE_DB=1
      # In-container the API is reached by compose service name; the host-side
      # loopback (127.0.0.1:8601) is NOT the api container's loopback.
      - JOB_AGENT_API_URL=http://api:8601
    restart: unless-stopped

  api:
    build: .
    container_name: job-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8601
    ports:
      - "127.0.0.1:8601:8601"
    volumes:
      - job_data:/app/data
    env_file:
      - .env
    environment:
      - JOB_AGENT_DATA_DIR=/app/data
      - JOB_AGENT_REQUIRE_DB=1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build: .
    container_name: job-worker
    command: python -m core.worker
    volumes:
      - job_data:/app/data
    env_file:
      - .env
    environment:
      - JOB_AGENT_DATA_DIR=/app/data
      - JOB_AGENT_REQUIRE_DB=1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  agent:
    build: .
    container_name: job-agent
    command: python -m core.main
    volumes:
      - job_data:/app/data
    env_file:
      - .env
    environment:
      - JOB_AGENT_DATA_DIR=/app/data
      - JOB_AGENT_REQUIRE_DB=1
    profiles:
      - manual   # triggered by cron, not kept alive

volumes:
  job_data:
    driver: local
