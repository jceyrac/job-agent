services:

  tracker:
    build: .
    container_name: job-tracker
    command: streamlit run tracker.py --server.port 8501 --server.address 0.0.0.0 --server.fileWatcherType none
    ports:
      - "8501:8501"
    volumes:
      - job_data:/app/data
    env_file:
      - .env
    environment:
      - JOB_AGENT_DATA_DIR=/app/data
      - JOB_AGENT_REQUIRE_DB=1
    restart: unless-stopped

  agent:
    build: .
    container_name: job-agent
    command: python main.py
    volumes:
      - job_data:/app/data
    env_file:
      - .env
    environment:
      - JOB_AGENT_DATA_DIR=/app/data
      - JOB_AGENT_REQUIRE_DB=1
    profiles:
      - manual   # triggered by cron, not kept alive

  email-monitor:
    build: .
    container_name: job-email-monitor
    command: python email_monitor.py
    volumes:
      - job_data:/app/data
    env_file:
      - .env
    environment:
      - JOB_AGENT_DATA_DIR=/app/data
      - JOB_AGENT_REQUIRE_DB=1
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Hydroxide on Ubuntu host
    profiles:
      - manual

volumes:
  job_data:
    driver: local
